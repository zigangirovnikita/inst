:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#fff;background:#111114}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#4e2871 0,transparent 36%),#111114}main{max-width:720px;margin:auto;padding:42px 20px 70px}.screen{animation:appear .35s ease}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}h1{font-size:clamp(31px,7.6vw,48px);line-height:1.04;margin:0 0 20px;letter-spacing:-.04em}h2{font-size:26px;margin:0 0 14px;letter-spacing:-.03em}p{line-height:1.5}.lead,.muted{color:#b9b3c1}.field-label{display:block;font-size:14px;color:#ded7e6;margin-bottom:9px}input,textarea{width:100%;border:1px solid #49424e;border-radius:14px;padding:16px;font:inherit;color:#fff;background:#1d1b21;outline:0}textarea{resize:vertical;min-height:110px}input:focus,textarea:focus{border-color:#eeb657}button{font:inherit;font-weight:750;border:0;border-radius:14px;cursor:pointer}.primary{width:100%;padding:17px;background:#f0b54d;color:#211806;margin-top:12px}.primary:disabled{opacity:.6;cursor:wait}.hero-animation{display:grid;gap:10px;margin:0 0 24px}.hero-card{position:relative;min-height:92px;padding:16px 16px 16px 112px;border:1px solid #39343f;border-radius:20px;background:#1c1a20;overflow:hidden}.hero-card b{display:block;color:#fff;margin-bottom:4px}.hero-card span{color:#b9b3c1;font-size:14px}.hero-visual{position:absolute;left:16px;top:14px;width:78px;height:64px}.phone{position:absolute;left:17px;top:4px;width:38px;height:58px;border:2px solid #7f688e;border-radius:10px;background:#211d27}.lens{position:absolute;left:37px;top:4px;width:34px;height:34px;border:3px solid #f0b54d;border-radius:50%;animation:scan-lens 2.6s ease-in-out infinite}.lens:after{content:"";position:absolute;width:18px;height:3px;background:#f0b54d;right:-13px;bottom:-6px;transform:rotate(45deg);border-radius:99px}@keyframes scan-lens{50%{transform:translate(-22px,19px) scale(1.08)}}.counter{position:absolute;inset:8px 0 0;display:grid;place-items:center;font-size:30px;font-weight:900;color:#f0b54d}.counter:before{content:"12";animation:count 2.4s steps(1,end) infinite}@keyframes count{20%{content:"18"}40%{content:"27"}60%,100%{content:"36+"}}.chart{position:absolute;left:8px;right:5px;bottom:11px;height:42px;border-left:2px solid #7f688e;border-bottom:2px solid #7f688e}.chart:before{content:"";position:absolute;left:6px;bottom:6px;width:58px;height:30px;background:linear-gradient(135deg,transparent 0 45%,#f0b54d 46% 54%,transparent 55%);animation:grow-chart 2.3s ease-in-out infinite}.chart:after{content:"";position:absolute;right:2px;top:0;border-left:8px solid #f0b54d;border-top:5px solid transparent;border-bottom:5px solid transparent;transform:rotate(-32deg);animation:grow-chart 2.3s ease-in-out infinite}@keyframes grow-chart{0%{clip-path:inset(0 100% 0 0)}70%,100%{clip-path:inset(0)}}.loading{display:grid;place-items:center;text-align:center;min-height:64vh}.clock{font-size:56px;animation:tick 1.3s ease-in-out infinite}@keyframes tick{50%{transform:rotate(8deg) scale(1.08)}}.question{overflow:hidden;border:1px solid #39343f;border-radius:18px;background:#1c1a20;margin:12px 0;transition:max-height .45s ease,opacity .35s ease}.question.closed{max-height:none;opacity:.57}.question.open{max-height:520px}.question-head{padding:18px;font-weight:700}.question-body{padding:0 18px 18px}.step{font-size:13px;color:#eeb657;margin-bottom:8px}.profile{background:#18171c;border:1px solid #39343f;border-radius:24px;padding:22px}.profile-top{display:flex;align-items:center;gap:16px}.avatar{width:80px;height:80px;border-radius:50%;background:#302c35;object-fit:cover}.name{font-weight:800;font-size:20px}.username{color:#b9b3c1}.stats{display:flex;gap:20px;margin:18px 0}.stats b{display:block}.bio{white-space:pre-wrap;color:#e6e1e9}.intro{margin:24px 0;color:#d2ccd8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tile{position:relative;aspect-ratio:9/14;border:0;background:#28242d;overflow:hidden;border-radius:4px}.tile img{width:100%;height:100%;object-fit:cover}.tile button{position:absolute;bottom:7px;left:7px;right:7px;padding:7px;background:#111114d9;color:#fff;font-size:12px}.tile button.viewed{background:#4f4757}.wait-box,.ready-box,.analysis-warning{display:flex;align-items:center;gap:13px;margin:25px 0;padding:17px;border:1px solid #3b3542;border-radius:16px;background:#1b1920}.analysis-warning{display:block;border-color:#8a6630;background:#2b221a}.wait-box .clock{font-size:28px}.loading-steps{position:relative;min-height:26px;margin-top:18px;color:#f0b54d;font-weight:800}.loading-steps span{position:absolute;left:0;right:0;opacity:0;animation:loading-step 18s infinite}.loading-steps span:nth-child(2){animation-delay:3s}.loading-steps span:nth-child(3){animation-delay:6s}.loading-steps span:nth-child(4){animation-delay:9s}.loading-steps span:nth-child(5){animation-delay:12s}.loading-steps span:nth-child(6){animation-delay:15s}@keyframes loading-step{0%,7%{opacity:0;transform:translateY(8px)}12%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-8px)}}.wait-box .loading-steps{margin-top:7px;font-size:14px}.ready-box{display:block}.reel-detail{margin-top:20px}.reel-detail img{width:100%;max-height:480px;object-fit:cover;border-radius:18px}.data{display:flex;gap:9px;flex-wrap:wrap;color:#bfb8c8;font-size:14px;margin:14px 0}.detail-block{border-top:1px solid #39343f;padding:15px 0}.detail-block b{display:block;color:#eeb657;font-size:13px;margin-bottom:6px}.detail-block p{white-space:pre-wrap;margin:0}.back{background:transparent;color:#eeb657;padding:0;margin-bottom:15px}.report-head{padding:22px;background:#251e2c;border:1px solid #4d3d5a;border-radius:22px;margin-bottom:15px}.report-card{padding:0;background:#1c1a20;border:1px solid #39343f;border-radius:18px;margin:12px 0;overflow:hidden}.report-toggle{display:flex;align-items:center;width:100%;gap:14px;padding:19px 20px;background:transparent;color:#fff;text-align:left}.report-toggle:focus-visible{outline:2px solid #eeb657;outline-offset:-3px}.report-title{font-size:22px;line-height:1.1;letter-spacing:-.03em}.report-score{margin-left:auto;color:#f0b54d;font-size:22px;white-space:nowrap}.report-chevron{color:#eeb657;font-size:20px}.report-body{padding:0 20px 20px;animation:appear .22s ease}.score{float:right;color:#f0b54d;font-size:22px}.errors{padding-left:19px;color:#d4cedb}.evidence{margin-top:14px;padding:11px 13px;border-left:3px solid #f0b54d;background:#211e25;color:#cfc7d8;border-radius:0 12px 12px 0}.footer-cta{text-align:center;margin-top:32px}.hidden{display:none}@media(max-width:420px){main{padding:30px 14px}.stats{gap:12px;font-size:13px}.report-title{font-size:19px}.report-toggle{padding:17px}.hero-card{padding-left:96px}.hero-visual{left:10px}}
.hero-animation{width:100%}.odometer{position:absolute;left:5px;top:5px;height:54px;display:flex;align-items:center;gap:4px;padding:7px 9px;border:1px solid #4f465a;border-radius:16px;background:linear-gradient(180deg,#25212b,#17151b);box-shadow:inset 0 1px #ffffff12,0 12px 24px #0005}.digit{width:24px;height:36px;overflow:hidden;border-radius:9px;background:#100f14;color:#f0b54d;font-size:28px;font-weight:900;line-height:36px;text-align:center;box-shadow:inset 0 0 0 1px #ffffff12}.digit i{display:block;font-style:normal}.digit.one i{animation:roll-one 2.8s cubic-bezier(.2,.8,.2,1) infinite}.digit.two i{animation:roll-two 2.8s cubic-bezier(.2,.8,.2,1) infinite}.plus{color:#f0b54d;font-size:25px;font-weight:900;margin-left:1px;animation:plus-pop 2.8s ease-in-out infinite}@keyframes roll-one{0%,4%{transform:translateY(0)}9%,13%{transform:translateY(-36px)}19%,100%{transform:translateY(-72px)}}@keyframes roll-two{0%,4%{transform:translateY(0)}9%,13%{transform:translateY(-36px)}19%,100%{transform:translateY(-72px)}}@keyframes plus-pop{0%,14%{opacity:.35;transform:scale(.72)}23%,100%{opacity:1;transform:none}}.chart-card{position:absolute;left:2px;top:1px;width:76px;height:62px;border:1px solid #4f465a;border-radius:15px;background:linear-gradient(180deg,#24202a,#151318);box-shadow:inset 0 1px #ffffff12,0 12px 24px #0004}.chart-card svg{display:block;width:100%;height:100%;overflow:visible}.chart-grid{stroke:#796a8e;stroke-width:.8;opacity:.25}.chart-fill{fill:#f0b54d;opacity:0;animation:chart-fill 2.8s ease-in-out infinite}.chart-line{fill:none;stroke:#f0b54d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:116;stroke-dashoffset:116;filter:drop-shadow(0 0 7px #f0b54d80);animation:draw-line 2.8s cubic-bezier(.2,.8,.2,1) infinite}.chart-dot{fill:#f0b54d;opacity:0;transform-box:fill-box;transform-origin:center;animation:dot-pop 2.8s ease-in-out infinite}.chart-dot:nth-of-type(2){animation-delay:.18s}.chart-dot:nth-of-type(3){animation-delay:.34s}.chart-dot:nth-of-type(4){animation-delay:.5s}.chart-arrow{fill:#f0b54d;opacity:0;animation:arrow-pop 2.8s ease-in-out infinite}@keyframes draw-line{0%,2%{stroke-dashoffset:116}22%,100%{stroke-dashoffset:0}}@keyframes chart-fill{0%,16%{opacity:0}30%,100%{opacity:.18}}@keyframes dot-pop{0%,18%{opacity:0;transform:scale(.5)}34%,100%{opacity:1;transform:scale(1)}}@keyframes arrow-pop{0%,24%{opacity:0;transform:translate(-5px,5px) scale(.7)}38%,100%{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.lens,.digit.one i,.digit.two i,.plus,.chart-line,.chart-fill,.chart-dot,.chart-arrow,.clock{animation:none}.digit.one i,.digit.two i{transform:translateY(-72px)}.plus,.chart-fill,.chart-dot,.chart-arrow{opacity:1}.chart-line{stroke-dashoffset:0}}
@media(max-width:520px){.hero-card{min-height:0;padding:88px 16px 18px}.hero-card b{font-size:17px}.hero-visual{left:16px;top:16px}.odometer{left:0}.chart-card{left:0}}
.start-title{font-size:clamp(25px,3.6vw,34px)!important;line-height:1.1!important;margin-bottom:20px!important}.start-field-label{font-size:18px;font-weight:800;line-height:1.25}.odometer{width:78px;display:grid;place-items:center;animation:counter-glow 2.8s ease-in-out infinite}.count-number{color:#f0b54d;font-size:30px;font-weight:900;line-height:1;animation:counter-pop 2.8s ease-in-out infinite}.count-number:before{content:"36+"}@keyframes counter-pop{0%,18%{transform:scale(.92);opacity:.82}32%,100%{transform:none;opacity:1}}@keyframes counter-glow{0%,35%{box-shadow:inset 0 1px #ffffff12,0 12px 24px #0005}55%,100%{box-shadow:inset 0 1px #ffffff18,0 12px 24px #0005,0 0 24px #f0b54d28}}
</style><link rel="stylesheet" href="/glass-signal.css"></head><body><a class="skip-link" href="#app">К содержимому</a><main id="app"></main><script>
const app=document.querySelector('#app');
const STORAGE_KEY='instagram-audit-state',CLIENT_KEY='instagram-audit-client',COOKIE_KEY='instagram-audit-resume';{const bootParams=new URLSearchParams(location.search);if(bootParams.has('fresh')){sessionStorage.removeItem(STORAGE_KEY);localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(CLIENT_KEY);document.cookie=COOKIE_KEY+'=; Max-Age=0; path=/; SameSite=Lax';bootParams.delete('fresh');const nextUrl=location.pathname+(bootParams.toString()?'?'+bootParams.toString():'')+location.hash;history.replaceState(null,'',nextUrl)}}const state={screen:'start',analysisId:null,analysis:null,answers:{niche:'',product:'',price:'',audience:'',name:''},question:0,opened:null,reportOpen:null,viewed:new Set(),poll:null};
if('scrollRestoration' in history)history.scrollRestoration='manual';
let lastViewKey=null;
const questions=[['niche','Чем ты занимаешься?','Например: психолог, дизайнер интерьеров, мастер по бровям'],['product','Что продаёшь?','Например: личные консультации, курс, услуги'],['price','Какая цена этого продукта?','В рублях'],['audience','Кто лучше всего покупает этот продукт?','Опиши целевую аудиторию'],['name','Как тебя зовут?','Твоё имя']];
const loadingSteps='<div class="loading-steps" aria-hidden="true"><span>Анализирую шапку профиля</span><span>Смотрю Reels</span><span>Сверяю оффер и воронку</span><span>Ищу точки роста</span><span>Считаю потенциал продаж</span><span>Составляю текст анализа</span></div>';
const safe=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const num=v=>v===null||v===undefined||v===''?'н/д':new Intl.NumberFormat('ru-RU').format(v);const dur=v=>v===null||v===''?'—':`${Math.floor(v/60)}:${String(Math.round(v%60)).padStart(2,'0')}`;const date=v=>v?new Intl.DateTimeFormat('ru-RU',{dateStyle:'medium'}).format(new Date(v)):'';const thumb=(v,f)=>{const urls=[v,f].filter(Boolean).map(url=>'url='+encodeURIComponent(url));return urls.length?'/api/thumbnail?'+urls.join('&'):''};
function getCookie(name){return document.cookie.split('; ').find(row=>row.startsWith(name+'='))?.slice(name.length+1)||''}
function syncResumeUrl(){if(!state.analysisId)return;const params=new URLSearchParams(location.search);if(params.get('analysisId')===state.analysisId)return;params.set('analysisId',state.analysisId);history.replaceState(null,'',location.pathname+'?'+params.toString()+location.hash)}
function clientId(){try{let id=localStorage.getItem(CLIENT_KEY);if(!id){id=crypto.randomUUID();localStorage.setItem(CLIENT_KEY,id)}return id}catch{return crypto.randomUUID()}}
function persist(){try{const snapshot=JSON.stringify({screen:state.screen,analysisId:state.analysisId,answers:state.answers,question:state.question,opened:state.opened,reportOpen:state.reportOpen,viewed:[...state.viewed]});sessionStorage.setItem(STORAGE_KEY,snapshot);localStorage.setItem(STORAGE_KEY,snapshot);if(state.analysisId){const resume=JSON.stringify({screen:state.screen,analysisId:state.analysisId,question:state.question,opened:state.opened,reportOpen:state.reportOpen,viewed:[...state.viewed]});document.cookie=COOKIE_KEY+'='+encodeURIComponent(resume)+'; Max-Age=2592000; path=/; SameSite=Lax';syncResumeUrl()}}catch{}}
function restore(){try{const raw=sessionStorage.getItem(STORAGE_KEY)||localStorage.getItem(STORAGE_KEY)||(getCookie(COOKIE_KEY)?decodeURIComponent(getCookie(COOKIE_KEY)):'');const saved=JSON.parse(raw||'null');if(saved?.analysisId){state.screen=saved.screen||'profile';state.analysisId=saved.analysisId;state.answers={...state.answers,...saved.answers};state.question=saved.question||0;state.opened=saved.opened??null;state.reportOpen=saved.reportOpen??null;state.viewed=new Set(saved.viewed||[])}}catch{}}
async function api(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw new Error(data.error||'Ошибка запроса');return data}
function scrollPageTop(){document.documentElement.scrollTop=0;document.body.scrollTop=0;requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}))}
function viewKey(){return state.screen+':'+(state.opened??'list')}
function trackScreenView(){try{const key='tracked:'+viewKey()+':'+(state.analysisId||'none');if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');fetch('/api/analyses/'+(state.analysisId||'none')+'/screen-view',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clientId:clientId(),screen:state.screen,details:{opened:state.opened,question:state.question,path:location.pathname}})}).catch(()=>{})}catch{}}
function render(){const previousView=lastViewKey,nextView=viewKey();lastViewKey=nextView;if(state.screen==='start')renderStart();else if(state.screen==='questions')renderQuestions();else if(state.screen==='profile')renderProfile();else if(state.screen==='errors')renderErrors();else if(state.screen==='funnelLoading')window.renderFunnelLoading?.();else if(state.screen==='funnelResult')window.renderFunnelResult?.();else if(state.screen==='growthPlanLoading')window.renderGrowthPlanLoading?.();else if(state.screen==='growthPlan')window.renderGrowthPlanResult?.();else if(state.screen==='liveAudit')window.renderLiveAudit?.();else if(state.screen==='leadForm')window.renderLeadForm?.();else if(state.screen==='leadSuccess')window.renderLeadSuccess?.();trackScreenView();if(previousView!==nextView)scrollPageTop()}
function renderStart(){app.innerHTML=`<section class="screen"><h1 class="start-title">Бесплатный анализ твоего Инстаграм + автоподбор оптимальной воронки продаж за 2 минуты</h1><div class="hero-animation" aria-hidden="true"><article class="hero-card"><div class="hero-visual"><i class="phone"></i><i class="lens"></i></div><b>Просканируем твой Инстаграм</b><span>Выявим места, которые можно быстро улучшить в оформлении и контенте, чтобы получить больше продаж.</span></article><article class="hero-card"><div class="hero-visual"><div class="odometer"><span class="count-number"></span></div></div><b>Проведем симуляцию продаж на более чем 36+ вариантах воронок</b><span>Выявим оптимальные варианты воронок, чтобы выбрать ту, которая дает максимум продаж.</span></article><article class="hero-card"><div class="hero-visual"><div class="chart-card"><svg viewBox="0 0 76 62" role="img"><line class="chart-grid" x1="12" y1="48" x2="66" y2="48"/><line class="chart-grid" x1="12" y1="34" x2="66" y2="34"/><line class="chart-grid" x1="12" y1="20" x2="66" y2="20"/><polygon class="chart-fill" points="12,48 25,41 38,34 51,22 64,13 64,48"/><path class="chart-line" d="M12 48 C20 45 22 39 29 40 C38 41 40 29 48 28 C56 27 58 16 64 13"/><circle class="chart-dot" cx="12" cy="48" r="3"/><circle class="chart-dot" cx="29" cy="40" r="3"/><circle class="chart-dot" cx="48" cy="28" r="3"/><path class="chart-arrow" d="M62 7 L70 12 L62 17 Z"/></svg></div></div><b>Построим план на 30 дней</b><span>Посчитаем твой потенциал по продажам и что нужно сделать в этом месяце, чтобы его реализовать</span></article></div><label class="field-label start-field-label" for="profile-input">Напиши ник Instagram или вставь ссылку</label><input id="profile-input" name="profileUrl" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="username или https://instagram.com/username…"><button class="primary" id="start">Начать анализ</button><p class="muted">Анализ обычно занимает 1–2 минуты. Пока он идёт, ты ответишь на несколько вопросов о продукте.</p></section>`;document.querySelector('#start').onclick=startAnalysis}
async function startAnalysis(){const button=document.querySelector('#start'),url=document.querySelector('#profile-input').value;button.disabled=true;button.textContent='Запускаем…';try{const data=await api('/api/analyses',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url,clientId:clientId()})});state.analysisId=data.analysisId;state.screen='questions';persist();startPolling();render()}catch(error){button.disabled=false;button.textContent=error.message}}
function renderQuestions(){const cards=questions.map(([key,title,placeholder],index)=>{const active=index===state.question,done=index<state.question;return `<article class="question ${active?'open':'closed'}"><div class="question-head"><span class="step">Вопрос ${index+1} из 5${done?' · готово':''}</span><br>${title}</div>${active?`<div class="question-body"><label class="field-label" for="answer">Твой ответ</label><textarea id="answer" name="${key}" autocomplete="off" maxlength="1000" placeholder="${placeholder}…">${safe(state.answers[key])}</textarea><button class="primary" id="next">Далее</button></div>`:''}</article>`}).join('');app.innerHTML=`<section class="screen"><h2>Чтобы рекомендации были точнее — ответь на 5 вопросов ниже👇</h2>${cards}</section>`;document.querySelector('#next').onclick=nextQuestion}
async function nextQuestion(){const key=questions[state.question][0],value=document.querySelector('#answer').value.trim();if(!value)return document.querySelector('#answer').focus();state.answers[key]=value;if(state.question<4){state.question+=1;persist();return render()}try{await api(`/api/analyses/${state.analysisId}/answers`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({answers:state.answers})});state.screen='profile';persist();await refresh();render()}catch(error){alert(error.message)}}
function loadingScreen(){app.innerHTML=`<section class="loading screen" role="status" aria-live="polite"><div class="clock" aria-hidden="true">◷</div><h2>Собираем Instagram</h2><p class="muted">Профиль получен. Загружаем Reels, расшифровываем ролики и собираем отчёт.</p>${loadingSteps}</section>`}
function renderProfile(){const a=state.analysis;if(!a||a.contentStatus==='processing')return loadingScreen();if(a.contentStatus==='failed')return app.innerHTML=`<section class="loading"><h2>Не удалось собрать Instagram</h2><p>${safe(a.error)}</p></section>`;if(state.opened!==null)return renderReel(a.reels[state.opened]);const p=a.profile;const tiles=a.reels.map((r,i)=>`<article class="tile">${r.thumbnailUrl?`<img src="${thumb(r.thumbnailUrl,r.thumbnailFallbackUrl)}" width="180" height="280" loading="lazy" onerror="this.style.display='none'">`:''}<button class="${state.viewed.has(i)?'viewed':''}" data-reel="${i}">${state.viewed.has(i)?'Просмотрен':'Смотреть'}</button></article>`).join('');const failedReels=(a.reels||[]).filter(r=>r.analysisError||!r.analysis).length;const warning=failedReels?`<div class="analysis-warning"><b>${failedReels} из ${(a.reels||[]).length} Reels не удалось обработать полностью</b><p class="muted">Оценка будет предварительной: техническую ошибку не считаем ошибкой контента.</p></div>`:'';const errorArea=a.errorStatus==='ready'?`<div class="ready-box"><p>Анализ ошибок готов. Я нашёл точки, которые могут мешать продажам.${failedReels?' Часть выводов предварительная из-за технических ошибок обработки.':''}</p><button class="primary" id="show-errors">Посмотреть анализ ошибок</button></div>`:`<div class="wait-box"><div class="clock">◷</div><div><b>Анализ ошибок почти готов</b><br><span class="muted">${a.errorStatus==='processing'?'Сопоставляем контент, аудиторию и воронку…':'Он запустится сразу, как будут готовы данные.'}</span>${loadingSteps}</div></div>`;app.innerHTML=`<section class="screen"><article class="profile"><div class="profile-top">${p.profilePicUrl?`<img class="avatar" src="${safe(p.profilePicUrl)}" width="80" height="80">`:'<div class="avatar"></div>'}<div><div class="name">${safe(p.fullName||p.username)}</div><div class="username">@${safe(p.username)}</div></div></div><div class="stats"><span><b>${num(p.postsCount)}</b>публикаций</span><span><b>${num(p.followersCount)}</b>подписчиков</span><span><b>${num(p.followingCount)}</b>подписок</span></div><p class="bio">${safe(p.biography||'Описание не указано')}</p></article><p class="intro">Профиль получен. Ниже — последние Reels, которые удалось загрузить для анализа.</p><div class="grid">${tiles}</div>${warning}${errorArea}</section>`;document.querySelectorAll('[data-reel]').forEach(button=>button.onclick=()=>{const i=Number(button.dataset.reel);state.viewed.add(i);state.opened=i;persist();render()});const show=document.querySelector('#show-errors');if(show)show.onclick=()=>{state.screen='errors';persist();render()}}
function renderReel(r){const a=r.analysis;app.innerHTML=`<section class="screen reel-detail"><button class="back" data-back>← Все Reels</button>${r.thumbnailUrl?`<img src="${thumb(r.thumbnailUrl,r.thumbnailFallbackUrl)}" width="720" height="480" onerror="this.remove()">`:''}<div class="data"><span>${date(r.timestamp)}</span><span>Длительность: ${dur(r.videoDuration)}</span><span>Просмотры: ${num(r.videoViewCount)}</span><span>Лайки: ${num(r.likesCount)}</span><span>Комментарии: ${num(r.commentsCount)}</span><span>Шеры: ${num(r.sharesCount)}</span><span>Сохранения: ${num(r.savesCount)}</span></div><div class="detail-block"><b>Описание</b><p>${safe(r.caption||'Без описания')}</p></div>${a?`<div class="detail-block"><b>Транскрибация</b><p>${safe(a.transcript||'Не обнаружено')}</p></div><div class="detail-block"><b>Что происходит на видео</b><p>${safe(a.videoDescription||'Не обнаружено')}</p></div><div class="detail-block"><b>Что изображено на превью</b><p>${safe(a.coverDescription||'Не обнаружено')}</p></div>`:`<p class="muted">${safe(r.analysisError||'Анализ видео недоступен.')}</p>`}<button class="back" data-back>← Все Reels</button></section>`;document.querySelectorAll('[data-back]').forEach(button=>button.onclick=()=>{state.opened=null;persist();render()})}
function reportCard(title,item,key){const open=state.reportOpen===key;const errors=(item.errors||[]).map(x=>`<li>${safe(x)}</li>`).join('')||'<li>Критичных ошибок не обнаружено.</li>';const evidence=item.evidence?`<div class="evidence"><b>На чём основано</b><br>${safe(item.evidence)}</div>`:'';return `<article class="report-card" data-report-section="${key}"><button class="report-toggle" data-report-card="${key}" aria-expanded="${open}"><span class="report-title">${title}</span><span class="report-score">${num(item.score)}/100</span><span class="report-chevron">${open?'−':'+'}</span></button>${open?`<div class="report-body"><p>${safe(item.verdict)}</p>${evidence}<b>Что мешает</b><ul class="errors">${errors}</ul><b>Что сделать</b><p>${safe(item.recommendation)}</p></div>`:''}</article>`}
function renderErrors(){const r=state.analysis?.errorAnalysis;if(!r)return renderProfile();const username=state.analysis.profile?.username||'Instagram';const name=state.analysis.answers?.name||'';const scenarioFormat=r.scenarioFormat||r.contentQuality;const failedReels=(state.analysis.reels||[]).filter(reel=>reel.analysisError||!reel.analysis).length;const preliminary=failedReels?`<div class="analysis-warning"><b>${failedReels} из ${(state.analysis.reels||[]).length} Reels не удалось обработать</b><p class="muted">Оценка предварительная. Это техническая проблема обработки, а не ошибка контента.</p></div>`:'';app.innerHTML=`<section class="screen"><article class="report-head"><h1>Анализ страницы @${safe(username)}</h1><p>${safe(r.headline)}</p><p>${safe(name)}, ниже — ошибки и конкретные точки роста, найденные по профилю, Reels и твоим ответам.</p></article>${preliminary}${reportCard('Шапка профиля',r.profileHeader,'profileHeader')}${reportCard('Частота публикаций',r.publishingFrequency,'publishingFrequency')}${reportCard('Сценарий и формат',scenarioFormat,'scenarioFormat')}${reportCard('Релевантность контента ЦА',r.audienceRelevance,'audienceRelevance')}${reportCard('Темы Reels: узко или широко',r.topicFocus,'topicFocus')}${reportCard('Воронка и офер',r.funnel,'funnel')}<div class="footer-cta"><p>Ошибки ты узнал, теперь я покажу что нужно сделать, чтобы увеличить продажи с Instagram!</p><button class="primary" id="next-stage">Как увеличить продажи</button></div></section>`;document.querySelectorAll('[data-report-card]').forEach(button=>button.onclick=()=>{const key=button.dataset.reportCard;state.reportOpen=state.reportOpen===key?null:key;persist();renderErrors();if(state.reportOpen)requestAnimationFrame(()=>document.querySelector(`[data-report-section="${key}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}))});document.querySelector('#next-stage').onclick=()=>window.startFunnel?.()}
async function refresh(shouldRender=true){if(!state.analysisId)return;try{const previous=state.analysis,next=await api(`/api/analyses/${state.analysisId}`);state.analysis=next;persist();const statusChanged=!previous||previous.contentStatus!==next.contentStatus||previous.errorStatus!==next.errorStatus;if(shouldRender&&state.screen==='profile'&&statusChanged)render()}catch{}}function startPolling(){clearInterval(state.poll);state.poll=setInterval(refresh,3000)}async function boot(){const params=new URLSearchParams(location.search),directId=params.get('analysisId');restore();if(directId&&state.analysisId!==directId){state.analysisId=directId;state.analysis=null;state.screen='profile';state.opened=null;state.reportOpen=null;state.viewed=new Set()}if(!state.analysisId)return renderStart();await refresh(false);if(state.screen==='funnelLoading')state.screen='funnelResult';if(state.screen==='growthPlanLoading')state.screen='growthPlan';persist();render();startPolling()}window.addEventListener('load',boot,{once:true});
</script><script src="/funnel.js"></script><script src="/growth-plan.js"></script><script src="/live-audit.js"></script></body></html>
